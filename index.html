<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fala Tio — Prospecção de Escolas</title>
  <meta name="description" content="Plataforma para gerir a prospecção ativa de escolas: lista interativa de contatos e funil Kanban." />
  <!-- PWA / Web App -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#071056" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fala Tio" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <img src="assets/falatio-logo.png" alt="Fala Tio" class="brand-logo-img" />
          <span class="brand-sep"></span>
          <div>
            <h1>Prospecção</h1>
            <p>Gestão de prospecção ativa de escolas</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost-light" id="btnHistorico" style="display:none">🕑 Histórico</button>
          <button class="btn btn-ghost-light" id="btnNova">＋ Nova escola</button>
          <div class="user-chip" id="userChip" style="display:none">
            <span id="userEmail"></span>
            <button id="btnLogout" title="Sair da conta">Sair</button>
          </div>
          <div class="menu-wrap">
            <button class="btn btn-ghost-light" id="btnMenu" aria-label="Menu de dados">⋯ Dados</button>
            <div class="menu" id="dataMenu">
              <button id="btnImport">⬆️ Importar planilha (CSV / JSON)</button>
              <button id="btnTemplate">📄 Baixar modelo de planilha</button>
              <hr />
              <button id="btnCSV">📊 Exportar planilha (CSV)</button>
              <button id="btnExport">⬇️ Exportar backup (JSON)</button>
              <hr />
              <button id="btnTheme">🌓 Alternar tema</button>
              <hr />
              <button id="btnReset" class="danger">↺ Restaurar dados originais</button>
            </div>
          </div>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <nav class="tabs">
        <button data-view="lista" class="active">📋 Lista</button>
        <button data-view="kanban">🗂️ Funil (Kanban)</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- ===== LISTA ===== -->
    <section class="view active" id="view-lista">
      <div class="toolbar">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por escola, decisor, bairro…" />
        </div>
        <select class="filter" id="filterEstado"><option value="">Todos os estados</option></select>
        <select class="filter" id="filterCidade"><option value="">Todas as cidades</option></select>
        <select class="filter" id="filterMedio">
          <option value="">Ensino médio (todos)</option>
          <option value="sim">Com ensino médio</option>
          <option value="nao">Sem ensino médio</option>
        </select>
        <select class="filter" id="filterEtapa"><option value="">Todas as etapas</option></select>
        <select class="filter" id="filterInovacao"><option value="">Toda inovação</option></select>
        <label class="chk-prio" title="Mantém as escolas do Ceará sempre no topo da lista">
          <input type="checkbox" id="prioCE" checked /> 🦅 Ceará primeiro
        </label>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="nome">Escola <span class="arrow">↕</span></th>
              <th data-sort="cidade">Local <span class="arrow">↕</span></th>
              <th data-sort="decisor_nome">Decisor <span class="arrow">↕</span></th>
              <th class="no-sort">Contatos</th>
              <th data-sort="alunos">Alunos <span class="arrow">↕</span></th>
              <th data-sort="ensino_medio">Médio <span class="arrow">↕</span></th>
              <th data-sort="score">Score <span class="arrow">↕</span></th>
              <th data-sort="etapa">Etapa <span class="arrow">↕</span></th>
              <th class="no-sort"></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== KANBAN ===== -->
    <section class="view" id="view-kanban">
      <div class="toolbar">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="kanbanSearch" placeholder="Buscar escola, decisor, bairro…" />
        </div>
        <span class="prio-legend">⭐ = tem próximos passos (prioridade)</span>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>
  </main>

  <!-- Drawer (detalhe / edição) -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer"></aside>

  <!-- Modal (importação / histórico) -->
  <div class="modal-card" id="modal"></div>

  <!-- Tela de login (só aparece quando o banco na nuvem está ativo) -->
  <div class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
      <img src="assets/falatio-logo.png" alt="Fala Tio" class="login-logo" />
      <h2>Prospecção de Escolas</h2>
      <p>Entre para acessar a base compartilhada do time</p>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required />
      <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" id="loginBtn">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept=".csv,.json,text/csv,application/json" style="display:none" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Registra o Service Worker (torna o site instalável como app)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
